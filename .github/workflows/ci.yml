name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — lint, type-check, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc -p tsconfig.build.json --noEmit
      - run: npm test
        env:
          # mongodb-memory-server downloads a real MongoDB binary on runners.
          MONGOMS_DOWNLOAD_TIMEOUT: 60000
      - run: npm run build

  frontend:
    name: Frontend — lint, type-check, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  ai-service:
    name: AI service — lint, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app tests
      - run: python -m pytest -q

  docker:
    name: Deployment configuration and Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          JWT_SECRET: ci-jwt-secret-0123456789abcdef
          HMAC_SECRET: ci-hmac-secret-0123456789abcdef
          OFFICIAL_JWT_SECRET: ci-official-secret-0123456789
        run: docker compose config -q
      - name: Validate nginx configuration
        run: |
          docker run --rm \
            -v "$PWD/frontend/nginx-map.conf:/etc/nginx/conf.d/00-rdd-map.conf:ro" \
            -v "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/frontend/nginx-headers.conf:/etc/nginx/snippets/rdd-headers.conf:ro" \
            nginx:1.27-alpine nginx -t
      - name: Build backend image
        run: docker build -t rdd-backend ./backend
      - name: Build frontend image
        run: docker build -t rdd-frontend ./frontend
      - name: Build AI service image
        run: docker build -t rdd-ai ./ai-service
