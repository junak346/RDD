server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security/discoverability headers use $request_uri, so they survive the SPA
    # fallback. Private-route obscurity is NOT security: every official API is
    # independently protected by auth, RBAC, CSRF, session expiry and DTO rules.
    include /etc/nginx/snippets/rdd-headers.conf;

    # Exact unadvertised login path.
    location = /official-access {
        try_files /index.html =404;
    }

    # Hidden command pages. ^~ prevents other regex locations from overriding.
    location ^~ /official {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are immutable; Cache-Control comes from the URI map.
    location /assets/ {
        try_files $uri =404;
    }

    # SPA routing for citizen pages.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not expose any upload directory; images are retrieved only through
    # authenticated, authorized API endpoints.
    location ~* ^/(uploads|upload-data)/ {
        deny all;
        return 404;
    }

    # Proxy the versioned API to the backend container.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    location /health {
        proxy_pass http://backend:5000/health;
    }
}
