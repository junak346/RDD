# Loaded before default.conf. $request_uri survives SPA internal redirects,
# so private-route headers remain attached when try_files serves index.html.
map $request_uri $rdd_robots_tag {
    default "";
    "~^/official-access(?:[/?]|$)" "noindex, nofollow, noarchive";
    "~^/official(?:[/?]|$)" "noindex, nofollow, noarchive";
}

map $request_uri $rdd_cache_control {
    default "";
    "~^/official-access(?:[/?]|$)" "no-store";
    "~^/official(?:[/?]|$)" "no-store";
    "~^/assets/" "public, max-age=604800, immutable";
}

map $request_uri $rdd_permissions_policy {
    default "camera=(self), geolocation=(self), microphone=()";
    "~^/official-access(?:[/?]|$)" "camera=(), geolocation=(), microphone=()";
    "~^/official(?:[/?]|$)" "camera=(), geolocation=(), microphone=()";
}
