# Full-stack local/production-ish deployment:
#   docker compose up --build
#
# Services: MongoDB · AI service · backend · frontend (nginx)
# Production camera/geolocation requires an HTTPS reverse proxy in front of
# the frontend. Set CLIENT_URL to the HTTPS origin and OFFICIAL_COOKIE_SECURE=true.
# See docs/DEPLOYMENT.md and docs/SECURITY.md.

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
      args:
        # Set to true and mount weights to enable real YOLO inference:
        INSTALL_ML: "false"
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      AI_MODE: ${AI_MODE:-auto}
      MODEL_PATH: /app/models/road_damage_yolo.pt
      MODEL_CONFIDENCE_THRESHOLD: ${MODEL_CONFIDENCE_THRESHOLD:-0.35}
      MODEL_IOU_THRESHOLD: ${MODEL_IOU_THRESHOLD:-0.45}
      MODEL_DEVICE: ${MODEL_DEVICE:-cpu}
      AI_MAX_IMAGE_MB: ${AI_MAX_IMAGE_MB:-16}
    volumes:
      # Mount trained weights here (see docs/AI_MODEL.md)
      - ./ai-service/models:/app/models

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      DATABASE_URL: mongodb://mongodb:27017/rdd
      DATA_MODE: mongo
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      HMAC_SECRET: ${HMAC_SECRET:?set HMAC_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      OFFICIAL_JWT_SECRET: ${OFFICIAL_JWT_SECRET:?set OFFICIAL_JWT_SECRET in .env}
      OFFICIAL_JWT_EXPIRES_IN: ${OFFICIAL_JWT_EXPIRES_IN:-8h}
      OFFICIAL_COOKIE_SECURE: ${OFFICIAL_COOKIE_SECURE:-false}
      OFFICIAL_LOGIN_MAX_FAILURES: ${OFFICIAL_LOGIN_MAX_FAILURES:-5}
      OFFICIAL_LOCKOUT_MINUTES: ${OFFICIAL_LOCKOUT_MINUTES:-15}
      OFFICIAL_BOOTSTRAP_EMAIL: ${OFFICIAL_BOOTSTRAP_EMAIL:-}
      OFFICIAL_BOOTSTRAP_PASSWORD: ${OFFICIAL_BOOTSTRAP_PASSWORD:-}
      OFFICIAL_BOOTSTRAP_NAME: ${OFFICIAL_BOOTSTRAP_NAME:-}
      OFFICIAL_BOOTSTRAP_DESIGNATION: ${OFFICIAL_BOOTSTRAP_DESIGNATION:-}
      OFFICIAL_BOOTSTRAP_DEPARTMENT: ${OFFICIAL_BOOTSTRAP_DEPARTMENT:-}
      AI_SERVICE_URL: http://ai-service:8000
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-60000}
      MODEL_CONFIDENCE_THRESHOLD: ${MODEL_CONFIDENCE_THRESHOLD:-0.35}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      UPLOAD_DIRECTORY: /data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      PUBLIC_REPORT_WINDOW_MINUTES: ${PUBLIC_REPORT_WINDOW_MINUTES:-60}
      PUBLIC_REPORT_MAX_REQUESTS: ${PUBLIC_REPORT_MAX_REQUESTS:-8}
      PUBLIC_REPORT_IDENTICAL_LIMIT: ${PUBLIC_REPORT_IDENTICAL_LIMIT:-3}
      PUBLIC_REPORT_DAILY_IP_LIMIT: ${PUBLIC_REPORT_DAILY_IP_LIMIT:-20}
      PUBLIC_REPORT_ABUSE_WINDOW_MINUTES: ${PUBLIC_REPORT_ABUSE_WINDOW_MINUTES:-60}
      MAX_LOCATION_ACCURACY_METERS: ${MAX_LOCATION_ACCURACY_METERS:-10000}
      MAX_LOCATION_AGE_MINUTES: ${MAX_LOCATION_AGE_MINUTES:-30}
      MAX_LOCATION_FUTURE_MINUTES: ${MAX_LOCATION_FUTURE_MINUTES:-5}
      DUPLICATE_RADIUS_METERS: ${DUPLICATE_RADIUS_METERS:-75}
      DUPLICATE_WINDOW_MINUTES: ${DUPLICATE_WINDOW_MINUTES:-1440}
      SLA_RULES_JSON: '${SLA_RULES_JSON:-{"LOW":168,"MEDIUM":96,"HIGH":48,"CRITICAL":24}}'
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - upload-data:/data/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_started

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo-data:
  upload-data:
